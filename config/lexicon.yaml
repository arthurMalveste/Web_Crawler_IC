# Lexico de identificacao de documentos de concepcao (ConOps).
#
# Reaproveitado integralmente na Etapa 3 (filtragem lexica sobre o texto completo)
# e como base do prompt da Etapa 5 (classificacao por LLM). Alterar aqui propaga.
#
# Normalizacao aplicada antes do casamento (ver prefilter.py):
#   minusculas, NFKD sem diacriticos, pontuacao -> espaco, espacos colapsados.
# Portanto "CON OPS", "Con-Ops" e "con ops" casam com o padrao "con ops".
#
# ATENCAO ao casamento por FRONTEIRA DE PALAVRA (`f" {termo} " in padded`):
# um termo no singular NAO casa com a ocorrencia no plural. Foi assim que
# "justification for change" ficou dois anos sem casar com o cabecalho real da
# norma, "Justification for changes". Ao adicionar um termo, decida se precisa
# das duas formas.

version: 2

#: `additive`  — so soma pontos (branch exp/lexico-stpa-iso-aditivo)
#: `penalizing`— soma e penaliza ausencia de safety (branch .../penalizado)
#: Unica diferenca entre as duas branches, junto com `safety_gate.require`.
variant: penalizing

# --- SINAL FORTE -------------------------------------------------------------
# Nomes institucionais do artefato. No TITULO -> faixa `strong` (baixar sempre).
# Em abstract/subject -> contribui para `weak`.
#
# Nao repetir formas que ja sao cobertas por substring com fronteira de palavra:
# "operational concept" ja casa dentro de "system operational concept" e de
# "preliminary operational concept". Os quatro ultimos sao lacunas REAIS.
strong_terms:
  - concept of operations
  - concepts of operations
  - conops
  - con ops
  - operational concept
  - operational concepts
  - operations concept
  - operations concepts
  - operating concept
  - operating concepts
  - opscon
  - ops con
  - operational concept description
  - concept of employment
  - conemp
  - mission concept
  - mission operations concept
  - science operations concept
  - system operational description
  - operational concept document
  - concept of use
  - conuse
  # ISO/IEC/IEEE 29148:2018 — o singular do Annex B (B.2 "Concept of operation
  # content") nao casa com o plural acima.
  - concept of operation
  - operation concept
  - conops document
  - opscon document

# Sinal moderado: sugerem conteudo de concepcao sem nomear o artefato.
# Nunca elevam sozinhos para `strong`; somam pontos para `weak`.
moderate_terms:
  - operational scenario
  - operational scenarios
  - operational view
  - ov-1
  - high level operational concept graphic
  - operational architecture
  - mission architecture
  - system of interest
  - stakeholder needs
  - operational need
  - modes of operation
  - operational environment
  # Conceitos de ciclo de vida irmaos do OpsCon (29148:2018, 6.2.3.4): um
  # documento que enumera estes cinco esta descrevendo a fase de concepcao,
  # mesmo sem usar a palavra ConOps.
  - acquisition concept
  - deployment concept
  - support concept
  - retirement concept
  - life cycle concept
  - life cycle concepts
  - preliminary life cycle concepts
  - other life cycle concepts
  - context of use
  - operational context
  - user classes
  - measures of effectiveness
  - measures of performance
  - technical performance measure
  - operational deployment
  - mission profile
  - day in the life
  - concept definition

# --- ASSINATURA ESTRUTURAL ---------------------------------------------------
# Titulos de secao canonicos da ISO/IEC/IEEE 29148 (2011 e 2018, Annex A) e da
# ANSI/AIAA G-043A-2012. Sao sinal muito mais especifico que o termo isolado:
# raramente aparecem juntos fora de um documento de concepcao de verdade.
#
# Uso na Etapa 1: casam contra abstract (poucos acertos, alta precisao).
# Uso na Etapa 3: casam contra o texto completo — e la que rendem de fato.
structural_signature:
  - current system or situation
  - justification for and nature of changes
  - justification for change
  - concepts for the proposed system
  - description of the proposed system
  - operational scenarios
  - summary of impacts
  - operational impacts
  - organizational impacts
  - impacts during development
  - analysis of the proposed system
  - advantages and limitations
  - alternatives and trade-offs
  - operational environment
  - support environment
  - modes of operation
  - user classes and other involved personnel
  - operational policies and constraints
  # --- ISO/IEC/IEEE 29148:2018, Annex A (normativo) e clausulas 9.3/9.4.
  # Redacao revista da segunda edicao e cabecalhos que nao existiam na de 2011.
  - justification for changes                    # A.2.5.2 — o singular acima NAO casa com isto
  - nature of changes
  - description of the current system or situation  # A.2.4.4
  - description of desired changes               # A.2.5.3
  - priorities among changes                     # A.2.5.4
  - changes considered but not included          # A.2.5.5
  - profiles of user classes                     # A.2.4.6.2
  - interactions among user classes              # A.2.4.6.3
  - other involved personnel                     # A.2.4.6.4
  - modes of operation for the current system    # A.2.4.5
  - background objectives and scope              # A.2.4.2 / A.2.6.2
  - disadvantages and limitations                # A.2.9.3 (2011/AIAA dizia "advantages and limitations")
  - alternatives considered                      # A.2.9.4 (2011/AIAA dizia "alternatives and trade-offs")
  - other detailed concepts of proposed system   # 9.4.18
  - high level operational concept               # 9.3.16
  - high level operational scenarios             # 9.3.17
  - other high level life cycle concepts         # 9.3.18
  - system operational modes and states          # 9.4.13

# --- ASSINATURA ESTRUTURAL COM PORTA -----------------------------------------
# ISO/IEC/IEEE 29148:2018, Annex B (informativo) — "Concept of operations",
# p. 87-88: o ConOps em nivel de ORGANIZACAO (estrategia, governanca,
# continuidade de negocio), que a edicao de 2011 nao tinha.
#
# Os cabecalhos do Annex B sao palavras como "Purpose", "Scope", "Security",
# "Compliance". Isolados nao valem NADA — estao em quase todo documento
# tecnico, e a 4.0 do bloco acima um unico acerto ja passaria de `weak_min`.
# Juntos sao outra coisa: sao a sumario de um ConOps organizacional.
#
# Por isso a porta: nada pontua ate `min_hits` termos DISTINTOS casarem no mesmo
# documento. E a regra que o comentario da assinatura estrutural sempre
# descreveu ("raramente aparecem juntos") e que o codigo nunca impunha.
structural_generic:
  min_hits: 5
  weight: 2.0          # metade do standalone: cada termo isolado e' fraco
  terms:
    # --- Annex B (informativo) — Concept of operations, p. 87-88
    - concept of operation content     # B.2
    - strategic plan                   # B.2.3
    - effectiveness                    # B.2.4
    - overall operation                # B.2.5
    - organizational unit              # B.2.5.3
    - governance                       # B.2.6
    - governance policies              # B.2.6.1
    - investment plan                  # B.2.6.3
    - information asset management     # B.2.6.4
    - business continuity plan         # B.2.6.6
    - compliance                       # B.2.6.7
    - purpose                          # B.2.1
    - scope                            # B.2.2
    - context                          # B.2.5.1
    - systems                          # B.2.5.2
    - organization                     # B.2.6.2
    - security                         # B.2.6.5
    # --- Annex A (normativo) — genericos demais para valerem sozinhos
    - identification                   # A.2.2.2
    - document overview                # A.2.2.3
    - system overview                  # A.2.2.4
    - referenced documents             # A.2.3
    - organizational structure         # A.2.4.6.1
    - assumptions and constraints      # A.2.5.6
    - benefits                         # A.2.9.2
    - appendices                       # A.2.10
    - glossary                         # A.2.11
    - overview
    - background

# --- NEGATIVOS ADVERSARIAIS --------------------------------------------------
# Contem sinal forte mas NAO sao documentos de concepcao. Rebaixam a faixa de
# `strong` para `weak` e sao marcados para revisao manual. Sao os negativos mais
# informativos do conjunto de validacao (secao 3.3 do plano).
