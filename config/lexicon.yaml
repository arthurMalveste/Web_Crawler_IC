# --- MECANISMO DO STPA, COM PORTA --------------------------------------------
# Vocabulario da estrutura de controle. Isolado e' engenharia de controle
# generica: "control structure" aparece em organograma, quimica de processos e
# teoria de controle classica; "feedback loop" esta em qualquer lugar. Em
# conjunto, e' uma analise STPA.
#
# Fora da lista de proposito: `controller`, `actuator`, `sensor` isolados —
# ruidosos demais em qualquer paper de embarcados, mesmo com porta.
safety_supporting:
  min_hits: 4
  weight: 1.5
  terms:
    - control structure
    - control structure diagram
    - control action
    - control actions
    - controlled process
    - control loop
    - feedback loop
    - process model
    - process model flaw
    - control algorithm
    - control flaw
    - inadequate control
    - emergent property
    - emergent properties
    - unsafe interaction
    - too early too late
    - wrong timing or order
    - providing causes hazard
    - not providing causes hazard

# --- PESOS E LIMIARES --------------------------------------------------------
scoring:
  weight_strong_title: 10.0
  weight_strong_body: 3.0        # abstract / subject terms
  weight_moderate_title: 2.0
  weight_moderate_body: 0.5
  weight_structural: 4.0         # por secao canonica distinta encontrada
  # Safety: deliberadamente abaixo de `strong`. STPA nao e indicio de ConOps,
  # e indicio de dominio critico — nao pode promover a `strong` sozinho.
  weight_safety_core_title: 3.0
  weight_safety_core_body: 1.0
  weight_safety_domain_title: 1.5
  weight_safety_domain_body: 0.5
  penalty_adversarial_title: -6.0
  penalty_adversarial_body: -1.5

# --- PORTA DE SAFETY ---------------------------------------------------------
# `require: false` -> este bloco e' inerte e o comportamento e' identico ao de
# antes de existir. E' o que sustenta atribuir a diferenca entre as duas
# branches EXCLUSIVAMENTE a penalidade: o codigo e' o mesmo, muda uma linha.
#
# `require: true` (branch exp/lexico-stpa-iso-penalizado):
#   - soma `penalty` ao score de todo documento SEM vocabulario de safety;
#   - e impede a promocao a `strong`, inclusive pelo atalho booleano do termo
#     forte no titulo — sem isso a penalidade quase nao mudaria a faixa.
safety_gate:
  require: true
  penalty: -4.0
  scope: core_or_domain          # ou `core_only`: exige STPA propriamente dito

thresholds:
  # strong: sinal forte no titulo e sem marcador adversarial no titulo.
  strong_min_score: 10.0
  # weak: qualquer sinal relevante fora do titulo, ou strong rebaixado.
  weak_min_score: 2.5
