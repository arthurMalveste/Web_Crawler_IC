# Lexico de identificacao de documentos de concepcao (ConOps).
#
# Reaproveitado integralmente na Etapa 3 (filtragem lexica sobre o texto completo)
# e como base do prompt da Etapa 5 (classificacao por LLM). Alterar aqui propaga.
#
# Normalizacao aplicada antes do casamento (ver prefilter.py):
#   minusculas, NFKD sem diacriticos, pontuacao -> espaco, espacos colapsados.
# Portanto "CON OPS", "Con-Ops" e "con ops" casam com o padrao "con ops".

version: 1

# --- SINAL FORTE -------------------------------------------------------------
# Nomes institucionais do artefato. No TITULO -> faixa `strong` (baixar sempre).
# Em abstract/subject -> contribui para `weak`.
strong_terms:
  - concept of operations
  - concepts of operations
  - conops
  - con ops
  - operational concept
  - operational concepts
  - operations concept
  - operations concepts
  - operating concept
  - operating concepts
  - opscon
  - ops con
  - operational concept description
  - concept of employment
  - conemp
  - mission concept
  - mission operations concept
  - science operations concept
  - system operational description
  - operational concept document
  - concept of use
  - conuse

# --- TERMOS DE BUSCA (discover) ----------------------------------------------
# Consulta enviada as fontes de API que aceitam busca textual (NTRS, CORE,
# GOV.UK). Subconjunto de `strong_terms`, menor de proposito: cada termo custa
# uma rodada de chamadas a API (no CORE, 15-60 s por chamada). O ROSA-P (lista
# o repositorio inteiro via OAI-PMH) e as fontes de crawl (seeds) nao usam.
# A descoberta e so por ConOps — dominio nunca entra aqui (decisao de 2026-11-19).
# `--terms` na linha de comando substitui esta lista numa execucao.
search_terms:
  - concept of operations
  - conops
  - operational concept
  - operations concept
  - operating concept
  - concept of employment
  - mission operations concept

# Sinal moderado: sugerem conteudo de concepcao sem nomear o artefato.
# Nunca elevam sozinhos para `strong`; somam pontos para `weak`.
moderate_terms:
  - operational scenario
  - operational scenarios
  - operational view
  - ov-1
  - high level operational concept graphic
  - operational architecture
  - mission architecture
  - system of interest
  - stakeholder needs
  - operational need
  - modes of operation
  - operational environment

# --- ASSINATURA ESTRUTURAL ---------------------------------------------------
# Titulos de secao canonicos da ISO/IEC/IEEE 29148:2011 (clausula ConOps) e da
# ANSI/AIAA G-043A-2012. Sao sinal muito mais especifico que o termo isolado:
# raramente aparecem juntos fora de um documento de concepcao de verdade.
#
# Uso na Etapa 1: casam contra abstract (poucos acertos, alta precisao).
# Uso na Etapa 3: casam contra o texto completo — e la que rendem de fato.
structural_signature:
  - current system or situation
  - justification for and nature of changes
  - justification for change
  - concepts for the proposed system
  - description of the proposed system
  - operational scenarios
  - summary of impacts
  - operational impacts
  - organizational impacts
  - impacts during development
  - analysis of the proposed system
  - advantages and limitations
  - alternatives and trade-offs
  - operational environment
  - support environment
  - modes of operation
  - user classes and other involved personnel
  - operational policies and constraints

# --- NEGATIVOS ADVERSARIAIS --------------------------------------------------
# Contem sinal forte mas NAO sao documentos de concepcao. Rebaixam a faixa de
# `strong` para `weak` e sao marcados para revisao manual. Sao os negativos mais
# informativos do conjunto de validacao (secao 3.3 do plano).
adversarial_markers:
  - review checklist
  - checklist for
  - lessons learned
  - meeting minutes
  - minutes of
  - agenda
  - presentation slides
  - viewgraph
  - status report
  - progress report
  - quarterly report
  - annual report
  - bibliography
  - literature review
  - trip report
  - press release
  - call for papers
  - workshop announcement
  - table of contents
  - errata
  - dissemination plan
  - data management plan
  - training syllabus
  - course outline

# --- PESOS E LIMIARES --------------------------------------------------------
scoring:
  weight_strong_title: 10.0
  weight_strong_body: 3.0        # abstract / subject terms
  weight_moderate_title: 2.0
  weight_moderate_body: 0.5
  weight_structural: 4.0         # por secao canonica distinta encontrada
  penalty_adversarial_title: -6.0
  penalty_adversarial_body: -1.5

thresholds:
  # strong: sinal forte no titulo e sem marcador adversarial no titulo.
  strong_min_score: 10.0
  # weak: qualquer sinal relevante fora do titulo, ou strong rebaixado.
  weak_min_score: 2.5

# --- DOMINIO: DUAS CONFIGURACOES INDEPENDENTES -------------------------------
# Termos de dominio NAO indicam ConOps: indicam que o documento e do dominio que
# o usuario procura. Decisao de 2026-11-19/20 (reuniao com a orientadora):
#   - a descoberta (discover) e so por ConOps — dominio nunca entra nela;
#   - o dominio entra em dois lugares, cada um com a SUA configuracao, editavel
#     separadamente no painel: `download` (decidir se vale baixar um candidato
#     ja encontrado) e `etapa3` (filtragem sobre o texto completo).
# As duas comecam com os mesmos dominios e termos, mas sao copias
# independentes de proposito: no download so ha titulo/resumo/assuntos, na
# Etapa 3 ha o texto inteiro — termos e pesos bons num nem sempre servem no
# outro.
#
# Cada dominio: `nome` (exibido no painel), `ativo` (entra ou nao na nota),
# `fortes` (especificos, raramente aparecem fora do dominio) e `moderados`
# (ambiguos, pesam menos). Os termos dos dominios ativos se somam numa nota so.
# STPA nao e exigido: e um dominio que soma pontos — aparece em poucos ConOps
# (11 dos 1.107 candidatos pelos metadados; 35 dos 306 textos completos).

# --- DOWNLOAD: FILTRO DE DOMINIO ANTES DE BAIXAR -----------------------------
# Desligado por padrao = baixa todo candidato com indicio de ConOps, sem olhar
# dominio (comportamento original da Etapa 1). Ligado, o candidato que nao
# atinge `limiar_dominio` nos metadados (titulo + resumo + assuntos) fica
# marcado como fora do dominio — nao e apagado: volta para a fila se a
# configuracao mudar, sem precisar descobrir de novo.
# Metadados sao curtos, entao a nota NAO e normalizada por tamanho: soma
# simples de `peso_forte` por termo forte e `peso_moderado` por moderado.
# Valores iniciais (1 termo forte ou 3 moderados) — a calibrar com a previa
# do painel. Aplicado a partir da fase 1 do plano do painel de palavras-chave.
download:
  filtrar_por_dominio: false
  peso_forte: 3.0
  peso_moderado: 1.0
  limiar_dominio: 3.0
  dominios:
    seguranca_stpa:
      nome: Segurança de sistemas / STPA
      ativo: true
      fortes:
        - stpa
        - stamp
        - system theoretic process analysis
        - systems theoretic accident model
        - hazard analysis
        - safety control structure
        - unsafe control action
        - loss scenario
        - functional hazard assessment
        - fault tree
        - fmea
        - safety case
        - system safety
      moderados:
        - hazard
        - safety
        - failure
        - risk
    aeronautica:
      nome: Aeronáutica
      ativo: true
      fortes:
        - aircraft
        - airspace
        - air traffic
        - air traffic management
        - air traffic control
        - avionics
        - flight deck
        - cockpit
        - airport
        - runway
        - rotorcraft
        - unmanned aircraft
        - uas
        - drone
        - nextgen
      moderados:
        # ambiguo: "pilot program" em relatorios de transporte terrestre
        - flight
        - pilot
        - airline
        - navigation
    espacial:
      nome: Espacial
      ativo: true
      fortes:
        - spacecraft
        - launch vehicle
        - space station
        - extravehicular activity
        - lunar
        - orbital
        - mars
        - moon
        - astronaut
        - spaceflight
        - international space station
        - deep space
        - artemis
      moderados:
        - mission
        - crew
        - payload
        - ground segment
        - telemetry
        - orbit
        - satellite  # ambiguo: "salt satellite facilities", GPS no ROSAP

# --- ETAPA 3: FILTRO SOBRE O TEXTO COMPLETO ----------------------------------
# Duas notas independentes por documento (ConOps e dominio), cada uma com seu
# limiar -> 4 faixas: ambos, so_conops, so_dominio, nenhum (etapa3/filtrar.py).
# A nota de ConOps usa strong_terms/moderate_terms/structural_signature (os
# mesmos da Etapa 1); a de dominio usa os dominios ativos abaixo.
# Termos contam por ocorrencia e sao normalizados por 10 mil palavras, para um
# relatorio de 300 paginas nao vencer so pelo tamanho. As secoes canonicas
# (structural_signature) contam por secao distinta achada como TITULO.
# Valores iniciais — a calibrar olhando a distribuicao das faixas.
etapa3:
  peso_forte: 3.0
  peso_moderado: 1.0
  peso_estrutural: 4.0
  # termo forte de ConOps no TITULO: um ConOps longo dilui a nota por tamanho
  # (ex.: "CLD Concept of Operations" da NASA ficou em 9,7 sem isto)
  peso_titulo_conops: 10.0
  limiar_conops: 10.0
  limiar_dominio: 20.0
  # dominio exige termos ESPECIFICOS: so moderados (safety, risk, failure...)
  # punham relatorios de seguranca viaria na faixa de dominio
  min_fortes_dominio: 3
  dominios:
    seguranca_stpa:
      nome: Segurança de sistemas / STPA
      ativo: true
      fortes:
        - stpa
        - stamp
        - system theoretic process analysis
        - systems theoretic accident model
        - hazard analysis
        - safety control structure
        - unsafe control action
        - loss scenario
        - functional hazard assessment
        - fault tree
        - fmea
        - safety case
        - system safety
      moderados:
        - hazard
        - safety
        - failure
        - risk
    aeronautica:
      nome: Aeronáutica
      ativo: true
      fortes:
        - aircraft
        - airspace
        - air traffic
        - air traffic management
        - air traffic control
        - avionics
        - flight deck
        - cockpit
        - airport
        - runway
        - rotorcraft
        - unmanned aircraft
        - uas
        - drone
        - nextgen
      moderados:
        # ambiguo: "pilot program" em relatorios de transporte terrestre
        - flight
        - pilot
        - airline
        - navigation
    espacial:
      nome: Espacial
      ativo: true
      fortes:
        - spacecraft
        - launch vehicle
        - space station
        - extravehicular activity
        - lunar
        - orbital
        - mars
        - moon
        - astronaut
        - spaceflight
        - international space station
        - deep space
        - artemis
      moderados:
        - mission
        - crew
        - payload
        - ground segment
        - telemetry
        - orbit
        - satellite  # ambiguo: "salt satellite facilities", GPS no ROSAP
