# Lexico de identificacao de documentos de concepcao (ConOps).
#
# Reaproveitado integralmente na Etapa 3 (filtragem lexica sobre o texto completo)
# e como base do prompt da Etapa 5 (classificacao por LLM). Alterar aqui propaga.
#
# Normalizacao aplicada antes do casamento (ver prefilter.py):
#   minusculas, NFKD sem diacriticos, pontuacao -> espaco, espacos colapsados.
# Portanto "CON OPS", "Con-Ops" e "con ops" casam com o padrao "con ops".

version: 1

# --- SINAL FORTE -------------------------------------------------------------
# Nomes institucionais do artefato. No TITULO -> faixa `strong` (baixar sempre).
# Em abstract/subject -> contribui para `weak`.
strong_terms:
  - concept of operations
  - concepts of operations
  - conops
  - con ops
  - operational concept
  - operational concepts
  - operations concept
  - operations concepts
  - operating concept
  - operating concepts
  - opscon
  - ops con
  - operational concept description
  - concept of employment
  - conemp
  - mission concept
  - mission operations concept
  - science operations concept
  - system operational description
  - operational concept document
  - concept of use
  - conuse

# Sinal moderado: sugerem conteudo de concepcao sem nomear o artefato.
# Nunca elevam sozinhos para `strong`; somam pontos para `weak`.
moderate_terms:
  - operational scenario
  - operational scenarios
  - operational view
  - ov-1
  - high level operational concept graphic
  - operational architecture
  - mission architecture
  - system of interest
  - stakeholder needs
  - operational need
  - modes of operation
  - operational environment

# --- ASSINATURA ESTRUTURAL ---------------------------------------------------
# Titulos de secao canonicos da ISO/IEC/IEEE 29148:2011 (clausula ConOps) e da
# ANSI/AIAA G-043A-2012. Sao sinal muito mais especifico que o termo isolado:
# raramente aparecem juntos fora de um documento de concepcao de verdade.
#
# Uso na Etapa 1: casam contra abstract (poucos acertos, alta precisao).
# Uso na Etapa 3: casam contra o texto completo — e la que rendem de fato.
structural_signature:
  - current system or situation
  - justification for and nature of changes
  - justification for change
  - concepts for the proposed system
  - description of the proposed system
  - operational scenarios
  - summary of impacts
  - operational impacts
  - organizational impacts
  - impacts during development
  - analysis of the proposed system
  - advantages and limitations
  - alternatives and trade-offs
  - operational environment
  - support environment
  - modes of operation
  - user classes and other involved personnel
  - operational policies and constraints

# --- NEGATIVOS ADVERSARIAIS --------------------------------------------------
# Contem sinal forte mas NAO sao documentos de concepcao. Rebaixam a faixa de
# `strong` para `weak` e sao marcados para revisao manual. Sao os negativos mais
# informativos do conjunto de validacao (secao 3.3 do plano).
adversarial_markers:
  - review checklist
  - checklist for
  - lessons learned
  - meeting minutes
  - minutes of
  - agenda
  - presentation slides
  - viewgraph
  - status report
  - progress report
  - quarterly report
  - annual report
  - bibliography
  - literature review
  - trip report
  - press release
  - call for papers
  - workshop announcement
  - table of contents
  - errata
  - dissemination plan
  - data management plan
  - training syllabus
  - course outline

# --- VOCABULARIO DO DOMINIO (Etapa 3) ----------------------------------------
# Nao indica ConOps: indica que o documento e do dominio do projeto —
# aeronautica + espacial, incluindo seguranca de sistemas / STPA (decisao de
# 2026-11-18). A Etapa 3 cruza este sinal com o de ConOps (termos acima) em
# 4 faixas: ambos, so ConOps, so dominio, nenhum. Nao usado pela Etapa 1.
domain_terms:
  # Especificos do dominio: raramente aparecem fora dele.
  strong:
    # seguranca de sistemas / STPA (antigo `safety_terms`)
    - stpa
    - stamp
    - system theoretic process analysis
    - systems theoretic accident model
    - hazard analysis
    - safety control structure
    - unsafe control action
    - loss scenario
    - functional hazard assessment
    - fault tree
    - fmea
    - safety case
    - system safety
    # aeronautica
    - aircraft
    - airspace
    - air traffic
    - air traffic management
    - air traffic control
    - avionics
    - flight deck
    - cockpit
    - airport
    - runway
    - rotorcraft
    - unmanned aircraft
    - uas
    - drone
    - nextgen
    # espacial
    - spacecraft
    - launch vehicle
    - space station
    - extravehicular activity
    - lunar
    - orbital
    - mars
    - moon
    - astronaut
    - spaceflight
    - international space station
    - deep space
    - artemis
  # Ambiguos: tambem aparecem fora do dominio (ex.: "pilot program" em
  # relatorios de transporte terrestre). Pesam menos.
  moderate:
    - flight
    - pilot
    - airline
    - navigation
    - mission
    - crew
    - payload
    - ground segment
    - telemetry
    - orbit
    - satellite  # ambiguo: "salt satellite facilities", GPS no ROSAP
    - hazard
    - safety
    - failure
    - risk

# --- PESOS E LIMIARES --------------------------------------------------------
scoring:
  weight_strong_title: 10.0
  weight_strong_body: 3.0        # abstract / subject terms
  weight_moderate_title: 2.0
  weight_moderate_body: 0.5
  weight_structural: 4.0         # por secao canonica distinta encontrada
  penalty_adversarial_title: -6.0
  penalty_adversarial_body: -1.5

thresholds:
  # strong: sinal forte no titulo e sem marcador adversarial no titulo.
  strong_min_score: 10.0
  # weak: qualquer sinal relevante fora do titulo, ou strong rebaixado.
  weak_min_score: 2.5

# --- ETAPA 3: FILTRO SOBRE O TEXTO COMPLETO ----------------------------------
# Duas notas independentes por documento (ConOps e dominio), cada uma com seu
# limiar -> 4 faixas: ambos, so_conops, so_dominio, nenhum (etapa3/filtrar.py).
# Termos contam por ocorrencia e sao normalizados por 10 mil palavras, para um
# relatorio de 300 paginas nao vencer so pelo tamanho. As secoes canonicas
# (structural_signature) contam por secao distinta achada como TITULO.
# Valores iniciais — a calibrar olhando a distribuicao das faixas.
etapa3:
  peso_forte: 3.0
  peso_moderado: 1.0
  peso_estrutural: 4.0
  # termo forte de ConOps no TITULO: um ConOps longo dilui a nota por tamanho
  # (ex.: "CLD Concept of Operations" da NASA ficou em 9,7 sem isto)
  peso_titulo_conops: 10.0
  limiar_conops: 10.0
  limiar_dominio: 20.0
  # dominio exige termos ESPECIFICOS: so moderados (safety, risk, failure...)
  # punham relatorios de seguranca viaria na faixa de dominio
  min_fortes_dominio: 3
