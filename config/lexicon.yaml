# critico. Por isso os pesos ficam abaixo dos de `strong_terms`: um paper puro
# de STPA sobe no maximo para `weak` (revisao manual), nunca para `strong`.
#
# Consumido desde 2026-08-26. Antes disso o bloco existia como `safety_terms` e
# era carregado sem nunca ser lido por codigo nenhum.
safety_core:
  - stpa
  - stamp
  - stpa sec                          # "STPA-Sec"; "stpa" ja casa aqui — ponto duplo intencional
  - stpa safesec
  - system theoretic process analysis
  - systems theoretic process analysis
  - system theoretic accident model
  - systems theoretic accident model
  - systems theoretic accident model and processes
  - causal analysis based on system theory
  - cast analysis                     # NUNCA "cast" isolado: casaria com fundicao, elenco, etc.
  - system theoretic early concept analysis
  - unsafe control action
  - unsafe control actions
  - hazardous control action
  - inadequate control action
  - loss scenario
  - loss scenarios
  - causal scenario
  - system level hazard
  - system level hazards
  - system level constraint
  - system level constraints
  - safety constraint
  - safety constraints
  - unacceptable loss
  - component interaction accident
  - safety guided design
  - safety control structure
  - hierarchical control structure
  - stopped too soon                  # tipologia de UCA (STPA Handbook)
  - applied too long
  - leveson

