scope:
  allow_hosts:
    - cordis.europa.eu
    - ec.europa.eu
  # Restrito de proposito: so' as paginas de projeto (onde estao os
  # entregaveis conhecidos) e o modulo de download que os serve. Sem isso o
  # crawler vazaria para o resto do cordis.europa.eu (busca, estatisticas,
  # outros projetos nao curados) — o oposto do desenho "niche" desta fonte.
  allow_paths:
    - '^/project/id/'
    - '^/research/participants/documents/downloadPublic'
  deny_paths:
    - '/search'
    - '/programme/'
    - '/statistics'
  max_depth: 2
  max_pages: 2000
  same_host_only: false

sitemap: none
render: false

notes: >
  Reuso incentivado, sujeito as condicoes de copyright; citar a fonte.
  Lista de seeds fechada por curadoria manual (2026-08-12) — nao cresce
  sozinha. Para ampliar a cobertura de SESAR/Cluster 5 sem violar o
  robots.txt do CORDIS, o caminho e' revisitar periodicamente
  https://cordis.europa.eu/search com os mesmos termos do lexico (pagina de
  busca normal, nao os dumps bulk) e curar manualmente os IDs de projeto
  novos — nao ha' hoje descoberta automatica desta fonte.
