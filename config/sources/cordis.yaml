# CORDIS — projetos de pesquisa da Comissao Europeia.
#
# HISTORICO — por que isto NAO e' um adaptador bulk (2026-08-12):
#
# O plano original (ver git log) era um adaptador dedicado lendo os dumps
# mensais CSV/XML/XLSX de data.europa.eu (`cordis-HORIZONprojectDeliverables
# -csv.zip`, `cordis-h2020projectDeliverables-csv.zip`, etc.), filtrando por
# programa prioritario ANTES do filtro lexico. Foi verificado ao vivo que o
# desenho funciona: dos ~254 mil entregaveis totais (HORIZON + H2020), o
# filtro de programa reduz para ~26 mil, e o lexico deste projeto reduz esse
# numero para 142 candidatos plausiveis — a lista de `seeds` abaixo vem
# exatamente dessa verificacao.
#
# MAS o download desses arquivos bulk mora em `cordis.europa.eu/data/`, e o
# `robots.txt` do CORDIS tem `Disallow: /data/` — confirmado com o
# `robotparser` real do projeto, nao por leitura superficial. Diferente do
# caso FAA/DTIC (onde o bloqueio e' um WAF generico contra bot, nao a
# politica declarada da instituicao — ver docs/achados-api.md), aqui e' o
# proprio `robots.txt` do CORDIS dizendo explicitamente para nao automatizar
# aquele caminho. Decisao do projeto (2026-08-12): respeitar o robots.txt e
# NAO usar os dumps bulk, mesmo com um "European Commission reuse notice"
# anexado ao dataset em data.europa.eu — reuso de dados nao e' permissao de
# rastreamento.
#
# SOLUCAO ADOTADA: `kind: seeds` — os 86 projetos cujos entregaveis JA FORAM
# verificados (via a mesma investigacao acima, antes de descartar a via bulk)
# como tendo pelo menos um entregavel de indicio forte/fraco. A pagina de
# resultados de cada projeto (`/project/id/{id}/results`) E' permitida pelo
# robots.txt, e contem os entregaveis como links com o TITULO REAL como
# ancora — e' dai que o titulo de cada documento vem, ver nota tecnica
# abaixo. Isso cobre os projetos ja identificados; novos projetos SESAR/
# Cluster 5 exigiriam nova curadoria manual (a via automatica de descoberta
# ampla continua bloqueada por robots.txt).
#
# NOTA TECNICA — o link do entregavel nunca e' o arquivo em si: e' uma pagina
# HTML ("Documents download module", em ec.europa.eu) que redireciona por
# JAVASCRIPT (`window.location='...'`), nao por link nem HTTP 30x. Suportado
# de forma generica em `engine/extract.py::_wrapper_de_download_js` (mesmo
# mecanismo de `citation_pdf_url`, so' que o titulo vem da ANCORA que levou
# ate' a pagina — o <title> do wrapper e' sempre o mesmo texto generico,
# ver `engine/crawler.py::_visitar`).

name: cordis
kind: seeds
strategy: focused

