# Politica de fetch. Um unico downloader, parametros por dominio.
#
# `rate` = segundos MINIMOS entre requisicoes ao dominio (nao req/s).
# `concurrency` = quantos downloads DESSE dominio ficam em voo ao mesmo tempo.
# `harvest` roda todos os dominios pendentes em paralelo; e' este numero,
# aplicado por host no Fetcher, que impede qualquer dominio individual de
# ultrapassar o combinado — nao um limite global do processo.
# Valores derivados de limites publicados ou medidos, nao chutados.

# Raiz do corpus — onde os arquivos baixados sao gravados.
#
# NAO escreva um caminho absoluto aqui: este arquivo e versionado, e um caminho
# absoluto e valido em UMA maquina so. O valor real vive na variavel
# CONOPS_DATA_ROOT do `.env` (fora do git); veja `.env.example`.
#
# O default abaixo cobre o layout padrao — o corpus como pasta irma do
# repositorio — e e resolvido a partir da raiz do REPOSITORIO, nao do diretorio
# de onde o comando foi chamado. Quem seguir esse layout nem precisa de `.env`.
#
# O .gitignore ja impede que o corpus entre no controle de versao.
data_root: "${CONOPS_DATA_ROOT:-../ConOpsCorpus}"

defaults:
  timeout_s: 60          # por operacao de leitura (httpx)
  max_download_s: 300    # relogio de parede do corpo inteiro; pega servidor lento
  max_file_mb: 60
  retries: 5
  backoff_base_s: 2.0
  backoff_max_s: 120.0
  respect_robots: true
  concurrency: 1
  rate: 2.0
  # Identificacao obrigatoria. TROCAR o e-mail pelo institucional antes da
  # primeira coleta em escala — e o que distingue um bot academico tolerado de
  # um bot anonimo bloqueado. O endereco vem de CONOPS_CONTACT_EMAIL (`.env`).
  user_agent: "UNICAMP-FT-ConOpsBot/0.1 (Iniciacao Cientifica STPA; +mailto:${CONOPS_CONTACT_EMAIL:-CONTATO@unicamp.br})"

domains:
  # 500 req / 15 min medido nos headers X-RateLimit-* -> 1.8 s/req.
  # 2.0 s da margem. O fetcher ainda le os headers e se auto-ajusta.
  ntrs.nasa.gov:
    rate: 2.0
    concurrency: 2
    respect_robots: true

  # CORE (core.ac.uk) — verificado ao vivo em 2026-08-12: cada chamada leva
  # 15-60s de resposta (nao e' throttling — x-ratelimit-remaining nao caiu
  # numa unica chamada; parece ser o tempo real do backend deles), entao o
  # `rate` abaixo quase nunca chega a ser o fator limitante. concurrency=1
  # por falta de evidencia de que a API aguenta paralelismo — a cota diaria
  # documentada varia por tier de registro (100 a 5.000 tokens/dia).
  api.core.ac.uk:
    rate: 2.0
    concurrency: 1
    respect_robots: true

  # GOV.UK Search/Content API — verificado ao vivo em 2026-08-14: sem limite
  # publicado, latencia real ~2s (busca) / <1s (conteudo). `robots.txt` so
  # bloqueia `/search/all*` (busca humana); `/api/` esta livre.
  www.gov.uk:
    rate: 1.0
    concurrency: 2
    respect_robots: true

  # CDN de anexos do GOV.UK, host separado da API — sem `robots.txt` (404),
  # serve o PDF direto.
  assets.publishing.service.gov.uk:
    rate: 1.0
    concurrency: 2
    respect_robots: true

  # Sem limite publicado; OAI-PMH e barato. 1 s/req e conservador.
  rosap.ntl.bts.gov:
    rate: 1.0
    concurrency: 2

  # Sem limite publicado nos bulk dumps; sao poucos arquivos grandes.
  # concurrency elevado para 3 em 2026-08-05, a titulo de experimento — ver
  # nota geral abaixo, junto de apps.dtic.mil.
  data.europa.eu:
    rate: 1.0
    concurrency: 3
  cordis.europa.eu:
    rate: 2.0
    concurrency: 3

  # ---------------------------------------------------------------------
  # EXCECAO DE USER-AGENT — decisao do projeto, registrada no relatorio.
  #
  # Os dois dominios abaixo estao atras de WAF (Akamai) e respondem 403 a
  # qualquer UA que nao seja exatamente o de um navegador. Testado em
  # 2026-08-04: o UA identificado toma 403, e um UA hibrido (navegador +
  # contato academico) TAMBEM toma 403 — nao ha meio-termo tecnico.
  # Na FAA, o proprio /robots.txt responde 403: a politica de rastreamento do
  # site e inacessivel ao cliente que a consultaria.
  #
  # Justificativa da excecao: sao documentos publicos de governo, publicados
  # para acesso publico; a regra do WAF e mitigacao generica de bots, nao
  # politica declarada da instituicao; e a taxa aqui e de 1 requisicao a cada
  # 3-4 s, sem qualquer carga relevante para o servidor.
  #
  # A excecao e restrita a estes dois hosts. Todo o resto do projeto continua
  # usando o UA identificado com contato institucional.
  # ---------------------------------------------------------------------
  #
  # EXPERIMENTO 2026-08-05: concurrency subiu de 1 para 3 em todos os hosts
  # abaixo que nao tinham limite publicado (decisao do operador, registrada
  # aqui). `rate` continua o mesmo — o que muda e' quantas conexoes ficam em
  # voo ao mesmo tempo, nao o intervalo entre inicios de requisicao.
  # RISCO CONHECIDO em apps.dtic.mil e (www.)faa.gov especificamente: os dois
  # estao atras de WAF (Akamai) e ja respondem 403 a UA nao-navegador: varias
  # conexoes simultaneas do mesmo cliente e' sinal classico de bot, e pode
  # levar o WAF a bloquear em vez de so responder mais devagar. Se aparecer
  # 403/429 novo ou queda no rendimento apos essa mudanca, volte concurrency
  # para 1 nestes dois hosts primeiro.
  apps.dtic.mil:
    rate: 3.0
    concurrency: 3
    browser_ua: true
    playwright_fallback: true

  www.faa.gov:
    rate: 4.0          # mais conservador: e o dominio de maior volume potencial
    concurrency: 3
    browser_ua: true
  faa.gov:
    rate: 4.0
    concurrency: 3
    browser_ua: true

  # ATENCAO: os seeds de esa_cosmos.yaml usam "www.cosmos.esa.int", nao
  # "cosmos.esa.int" — sem a entrada abaixo com "www.", esta politica nunca
  # era de fato aplicada ao rastreamento real (caia no default). Corrigido
  # junto com a subida de concurrency, senao o experimento nao testaria nada.
  cosmos.esa.int:
    rate: 2.0
    concurrency: 3
    max_depth: 3
  www.cosmos.esa.int:
    rate: 2.0
    concurrency: 3
    max_depth: 3

  psas.scripts.mit.edu:
    rate: 1.0
    concurrency: 3

  sunnyday.mit.edu:
    rate: 1.0
    concurrency: 3

# Dominios que o coletor NUNCA acessa, mesmo que apareca link.
# Nao e otimizacao: e restricao juridica/etica registrada no relatorio.
blocklist:
  # Content Server da ESA: exige autenticacao. Nao tentar.
  - dms.cosmos.esa.int
  # Exige CAC/PIV. Nao tentar.
  - rndgateway.dtic.mil
  - discover.dtic.mil.s3
